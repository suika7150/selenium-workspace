[pytest]
# 強制將當前執行目錄加入 Python 的路徑中
pythonpath = .

# 設定測試案例的預設搜尋目錄
testpaths = tests

# 設定預設執行的參數
# -s: 允許在終端機顯示程式中的 print() 訊息
# -v: 顯示更詳細的測試案例執行狀態與名稱
# --alluredir: 自動將測試產出的 RAW Data 與失敗截圖存入指定的資料夾，供 Allure 報告使用
# --html / --self-contained-html: 自動產出獨立漂亮的 HTML 測試報告檔
addopts = -s -v --alluredir=./allure-results --html=report.html --self-contained-html
